<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results | AccessLearn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>AccessLearn</h1>
    <p>Learn. Understand. Succeed.</p>

    <button id="themeToggle">🌙 Dark Mode</button>
</header>

<main>

    <h2>🎉 Quiz Completed!</h2>

    <div class="result-card">

        <h3>Your Score</h3>

        <p class="score" id="score">Loading...</p>

        <p class="feedback" id="feedback"></p>

    </div>

    <button onclick="location.href='index.html'">

        🏠 Back to Home

    </button>

</main>

<script>

const score = sessionStorage.getItem("quizScore");
const total = sessionStorage.getItem("quizTotal");

const scoreElement = document.getElementById("score");
const feedbackElement = document.getElementById("feedback");

if (score !== null && total !== null) {

    scoreElement.textContent = `${score} / ${total}`;

    const percentage = (Number(score) / Number(total)) * 100;

    if (percentage >= 80) {

        feedbackElement.innerHTML =
            "Excellent Work! 🌟<br><br>Keep learning and improving.";

    } else if (percentage >= 50) {

        feedbackElement.innerHTML =
            "Good Job! 👍<br><br>Keep practicing and improving.";

    } else {

        feedbackElement.innerHTML =
            "Good effort! 💪<br><br>Keep learning and try again.";

    }

} else {

    scoreElement.textContent = "Score unavailable";

    feedbackElement.textContent =
        "Please complete the quiz again.";

}

</script>
<script src="script.js"></script>
</body>
</html>
