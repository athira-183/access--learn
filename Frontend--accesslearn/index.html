<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AccessLearn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>AccessLearn</h1>
        <p>Learn. Understand. Succeed.</p>
    </header>

    <main>

    <h2>Upload Your Study Material</h2>

    <p>
        Upload your study material and get simplified notes
        that are easier to understand.
    </p>

    <div class="upload-box">

        <div class="upload-icon">📄</div>

        <h3>Upload Your PDF</h3>

        <p>Choose a PDF file containing your study material.</p>

        <label for="pdfUpload" class="choose-file-button">
            Choose PDF
        </label>

        <input type="file" id="pdfUpload" accept=".pdf">

        <p id="fileName">No file selected</p>

        <button id="uploadButton">Upload PDF</button>

    </div>

</main>
    <script src="script.js"></script>

</body>
</html>
