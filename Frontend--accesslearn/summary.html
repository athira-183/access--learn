<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simplified Notes | AccessLearn</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>AccessLearn</h1>
    <p>Learn. Understand. Succeed.</p>

</header>

<main>

    <h2>Simplified Notes</h2>

    <div class="accessibility-tools">

        <button>A−</button>
        <button>A</button>
        <button>A+</button>

        <button>🔊 Read Aloud</button>

    </div>

    <div class="summary-box" id="summaryBox">
    <p>Loading extracted text...</p>
</div>

<script>
    const extractedText = sessionStorage.getItem("extractedText");
    const summaryBox = document.getElementById("summaryBox");

    if (extractedText) {
        summaryBox.innerHTML = "";

        const p = document.createElement("p");
        p.textContent = extractedText;

        summaryBox.appendChild(p);
    } else {
        summaryBox.innerHTML = "<p>No extracted text found.</p>";
    }
</script>

   <button class="quiz-button" onclick="location.href='quiz.html'">

Generate Quiz

</button>

</main>

<script src="script.js"></script>

</body>

</html>
